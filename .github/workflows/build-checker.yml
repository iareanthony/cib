name: Build CIB Checker

on:
  push:
    branches:
      - feature/kubernetes-compliance
    paths:
      - checker/**
      - .github/workflows/build-checker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./checker
          push: true
          tags: ghcr.io/iareanthony/cib-checker:feature-kubernetes-compliance
