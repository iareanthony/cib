apiVersion: v1
kind: ServiceAccount
metadata:
  name: cib-checker
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cib-checker
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cib-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cib-checker
subjects:
  - kind: ServiceAccount
    name: cib-checker
    namespace: security
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cib-trivy-cache
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cib-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cib-victoriametrics-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cib-victoriametrics
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cib-victoriametrics
  template:
    metadata:
      labels:
        app: cib-victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          args:
            - --storageDataPath=/storage
            - --retentionPeriod=90d
            - --httpListenAddr=:8428
            - --search.maxStalenessInterval=7h
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cib-victoriametrics-data
---
apiVersion: v1
kind: Service
metadata:
  name: cib-victoriametrics
  namespace: security
spec:
  selector:
    app: cib-victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cib-checker
  namespace: security
spec:
  timeZone: America/New_York
  schedule: "30 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: cib-checker
        spec:
          serviceAccountName: cib-checker
          restartPolicy: Never
          containers:
            - name: checker
              image: ghcr.io/iareanthony/cib-checker:feature-kubernetes-compliance
              imagePullPolicy: Always
              args:
                - --once
              env:
                - name: DISCOVERY_PROVIDER
                  value: kubernetes
                - name: KUBERNETES_CLUSTER_NAME
                  value: amftech
                - name: VICTORIAMETRICS_URL
                  value: http://cib-victoriametrics.security.svc.cluster.local:8428
                - name: SBOM_DIR
                  value: /data/sboms
                - name: TRIVY_TIMEOUT
                  value: "600"
                - name: LICENSE_DENY_LIST
                  value: GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: trivy-cache
                  mountPath: /root/.cache/trivy
                - name: data
                  mountPath: /data
          volumes:
            - name: trivy-cache
              persistentVolumeClaim:
                claimName: cib-trivy-cache
            - name: data
              persistentVolumeClaim:
                claimName: cib-data
